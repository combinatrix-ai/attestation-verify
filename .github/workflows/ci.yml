name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Format, lint, docs, and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy with warnings denied
        run: cargo clippy --all-targets -- -D warnings

      - name: Build documentation with warnings denied
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps

      - name: Run tests
        run: cargo test --locked

  test:
    name: Native cryptographic fixture tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Run native cryptographic fixture tests
        run: cargo test --locked

  cross-build:
    name: Cross-build library and examples (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
            builder: cargo
          - os: macos-latest
            target: aarch64-apple-darwin
            builder: cargo
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            builder: cargo-zigbuild
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            builder: cargo-zigbuild
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            builder: cargo-zigbuild
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            builder: cargo-zigbuild

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up stable Rust for ${{ matrix.target }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          key: cross-${{ matrix.target }}

      - name: Install Zig for Linux cross-builds
        if: matrix.builder == 'cargo-zigbuild'
        shell: bash
        run: |
          set -euo pipefail
          zig_arch="$(case "$(uname -m)" in
            x86_64|amd64) echo x86_64 ;;
            aarch64|arm64) echo aarch64 ;;
            *) echo "unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac)"
          zig_os="$(case "$(uname -s)" in
            Linux) echo linux ;;
            Darwin) echo macos ;;
            *) echo "unsupported runner OS: $(uname -s)" >&2; exit 1 ;;
          esac)"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "https://ziglang.org/download/0.15.2/zig-${zig_arch}-${zig_os}-0.15.2.tar.xz" \
            | tar -xJ -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/zig-${zig_arch}-${zig_os}-0.15.2" >> "${GITHUB_PATH}"

      - name: Install cargo-zigbuild for Linux cross-builds
        if: matrix.builder == 'cargo-zigbuild'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build library and examples
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.builder }}" = "cargo-zigbuild" ]; then
            cargo zigbuild --release --locked --target "${{ matrix.target }}" --lib
            cargo zigbuild --release --locked --target "${{ matrix.target }}" --examples
          else
            cargo build --release --locked --target "${{ matrix.target }}" --lib
            cargo build --release --locked --target "${{ matrix.target }}" --examples
          fi

  dep-budget:
    name: Dependency budget
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Measure dependency budget
        run: ./scripts/dep-budget.sh

  msrv:
    name: MSRV (Rust 1.88)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.88 MSRV toolchain
        uses: dtolnay/rust-toolchain@1.88

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Check library with MSRV
        run: cargo check --locked

      - name: Check examples with MSRV
        run: cargo check --locked --examples

  fuzz:
    name: Parser fuzz smoke
    runs-on: ubuntu-latest
    env:
      # Keep the complete CI budget in one obvious place so it can be raised
      # without changing the target loop below.
      FUZZ_SMOKE_SECONDS: "60"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up nightly Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache Cargo registry and fuzz target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> fuzz/target
          key: fuzz-nightly

      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked

      - name: Verify fixture-derived corpora are current
        run: |
          set -euo pipefail
          python3 fuzz/scripts/generate_corpora.py
          git diff --exit-code -- fuzz/corpus

      - name: Run bounded smoke fuzzing for every parser target
        run: |
          set -euo pipefail
          targets=(
            bundle
            jsonl
            github_api
            statement
            trusted_root
            rekor_body
            checkpoint
            sct
            rfc3339
          )
          for target in "${targets[@]}"; do
            echo "Running ${target} for ${FUZZ_SMOKE_SECONDS}s"
            cargo +nightly fuzz run "${target}" -- \
              -max_total_time="${FUZZ_SMOKE_SECONDS}" \
              -print_final_stats=1
          done
