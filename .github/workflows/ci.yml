name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Format, lint, docs, and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, as of 2026-08-02
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2, as of 2026-08-02

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy with warnings denied
        run: cargo clippy --all-targets -- -D warnings

      - name: Build documentation with warnings denied
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps

      - name: Run tests
        run: cargo test --locked

  test:
    name: Native cryptographic fixture tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, as of 2026-08-02
        with:
          toolchain: stable

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2, as of 2026-08-02

      - name: Run native cryptographic fixture tests
        run: cargo test --locked

  cross-build:
    name: Cross-build library and examples (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
            builder: cargo
          - os: macos-latest
            target: aarch64-apple-darwin
            builder: cargo
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            builder: cargo-zigbuild
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            builder: cargo-zigbuild
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            builder: cargo-zigbuild
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            builder: cargo-zigbuild

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up stable Rust for ${{ matrix.target }}
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, as of 2026-08-02
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2, as of 2026-08-02
        with:
          key: cross-${{ matrix.target }}

      - name: Install Zig for Linux cross-builds
        if: matrix.builder == 'cargo-zigbuild'
        shell: bash
        run: |
          set -euo pipefail
          zig_version=0.15.2
          zig_arch="$(case "$(uname -m)" in
            x86_64|amd64) echo x86_64 ;;
            aarch64|arm64) echo aarch64 ;;
            *) echo "unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac)"
          zig_os="$(case "$(uname -s)" in
            Linux) echo linux ;;
            Darwin) echo macos ;;
            *) echo "unsupported runner OS: $(uname -s)" >&2; exit 1 ;;
          esac)"
          # Checksums as published by ziglang.org for 0.15.2, recorded here on
          # purpose: a checksum fetched from the same host as the tarball would
          # move with it and prove nothing. Committing the value is what makes
          # a substituted tarball detectable. Unlisted platforms fail closed.
          zig_sha256="$(case "${zig_arch}-${zig_os}" in
            x86_64-linux) echo 02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239 ;;
            aarch64-linux) echo 958ed7d1e00d0ea76590d27666efbf7a932281b3d7ba0c6b01b0ff26498f667f ;;
            x86_64-macos) echo 375b6909fc1495d16fc2c7db9538f707456bfc3373b14ee83fdd3e22b3d43f7f ;;
            aarch64-macos) echo 3cc2bab367e185cdfb27501c4b30b1b0653c28d9f73df8dc91488e66ece5fa6b ;;
            *) echo "no recorded Zig checksum for ${zig_arch}-${zig_os}" >&2; exit 1 ;;
          esac)"
          zig_dir="zig-${zig_arch}-${zig_os}-${zig_version}"
          tarball="${RUNNER_TEMP}/${zig_dir}.tar.xz"
          # Download to a file rather than piping into tar: the previous
          # `curl | tar -xJ` had already extracted the archive by the time
          # anything could have checked it.
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "https://ziglang.org/download/${zig_version}/${zig_dir}.tar.xz" \
            --output "${tarball}"
          if command -v sha256sum >/dev/null 2>&1; then
            printf '%s  %s\n' "${zig_sha256}" "${tarball}" | sha256sum --check --strict -
          else
            printf '%s  %s\n' "${zig_sha256}" "${tarball}" | shasum -a 256 --check --strict -
          fi
          tar -xJf "${tarball}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/${zig_dir}" >> "${GITHUB_PATH}"

      - name: Install cargo-zigbuild for Linux cross-builds
        if: matrix.builder == 'cargo-zigbuild'
        uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2.85.6
        with:
          tool: cargo-zigbuild

      - name: Build library and examples
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.builder }}" = "cargo-zigbuild" ]; then
            cargo zigbuild --release --locked --target "${{ matrix.target }}" --lib
            cargo zigbuild --release --locked --target "${{ matrix.target }}" --examples
          else
            cargo build --release --locked --target "${{ matrix.target }}" --lib
            cargo build --release --locked --target "${{ matrix.target }}" --examples
          fi

  dep-budget:
    name: Dependency budget
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, as of 2026-08-02
        with:
          toolchain: stable

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2, as of 2026-08-02

      - name: Measure dependency budget
        run: ./scripts/dep-budget.sh

  msrv:
    name: MSRV (Rust 1.88)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust 1.88 MSRV toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, as of 2026-08-02
        with:
          # Quoted: unquoted YAML reads this as a float, which would silently
          # turn a future `1.90` into toolchain "1.9".
          toolchain: "1.88"

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2, as of 2026-08-02

      - name: Check library with MSRV
        run: cargo check --locked

      - name: Check examples with MSRV
        run: cargo check --locked --examples

  conformance:
    name: Sigstore client conformance (verification subset)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, as of 2026-08-02
        with:
          toolchain: stable

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2, as of 2026-08-02

      - name: Build conformance client
        run: cargo build --locked --release --bin conformance

      - name: Validate expected-failure manifest
        id: conformance-xfails
        shell: bash
        run: |
          set -euo pipefail
          manifest="tests/conformance-expected-failures.txt"
          patterns_file="${RUNNER_TEMP}/conformance-xfail-patterns"
          awk -F '\t' '
            /^[[:space:]]*#/ || /^[[:space:]]*$/ { next }
            NF < 2 {
              printf "malformed expected-failure entry at line %d\n", NR > "/dev/stderr"
              exit 1
            }
            $1 in seen {
              printf "duplicate expected-failure entry %q at line %d\n", $1, NR > "/dev/stderr"
              exit 1
            }
            { seen[$1] = 1; print $1 }
          ' "${manifest}" > "${patterns_file}"
          test -s "${patterns_file}"
          printf 'patterns=%s\n' "$(paste -sd ' ' "${patterns_file}")" >> "${GITHUB_OUTPUT}"

      # Pinned to sigstore-conformance main at the source revision inspected
      # for this gate: f12aa02f4a6e5a9e84bcc3c10c193b14ab04da9d.
      - name: Run official Sigstore conformance suite
        uses: sigstore/sigstore-conformance@f12aa02f4a6e5a9e84bcc3c10c193b14ab04da9d
        with:
          entrypoint: ${{ github.workspace }}/target/release/conformance
          skip-signing: true
          skip-cpython-release-tests: true
          xfail: ${{ steps.conformance-xfails.outputs.patterns }}

  fuzz:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    env:
      # Keep the complete CI budget in one obvious place so it can be raised
      # without changing the target loop below.
      FUZZ_SMOKE_SECONDS: "60"
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up nightly Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, as of 2026-08-02
        with:
          toolchain: nightly

      - name: Cache Cargo registry and fuzz target
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2, as of 2026-08-02
        with:
          workspaces: fuzz -> fuzz/target
          key: fuzz-nightly

      - name: Install cargo-fuzz
        # `--locked` pins cargo-fuzz's dependencies but not cargo-fuzz itself;
        # `--version` is what stops this gate's tooling from moving on its own.
        run: cargo +nightly install cargo-fuzz --locked --version 0.13.2

      - name: Verify fixture-derived corpora are current
        run: |
          set -euo pipefail
          python3 fuzz/scripts/generate_corpora.py
          git diff --exit-code -- fuzz/corpus

      - name: Run bounded smoke fuzzing for every target
        run: |
          set -euo pipefail
          targets=(
            bundle
            jsonl
            github_api
            statement
            trusted_root
            rekor_body
            checkpoint
            checkpoint_verify
            sct
            rfc3339
          )
          for target in "${targets[@]}"; do
            echo "Running ${target} for ${FUZZ_SMOKE_SECONDS}s"
            cargo +nightly fuzz run "${target}" -- \
              -max_total_time="${FUZZ_SMOKE_SECONDS}" \
              -print_final_stats=1
          done
