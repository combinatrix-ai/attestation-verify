name: Publish crate

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish attestation-verify
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - name: Check out the release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, as of 2026-08-02
        with:
          toolchain: stable

      - name: Validate tag and package version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF_TYPE}" = tag || {
            echo "expected a tag ref, not ${GITHUB_REF}" >&2
            exit 1
          }
          [[ "${RELEASE_TAG}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?)$ ]] || {
            echo "invalid release tag: ${RELEASE_TAG}" >&2
            exit 1
          }
          RELEASE_VERSION="${BASH_REMATCH[1]}"
          package_version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "attestation-verify") | .version')"
          test "${package_version}" = "${RELEASE_VERSION}" || {
            echo "Cargo package version ${package_version} does not match ${RELEASE_VERSION}" >&2
            exit 1
          }

      - name: Test the locked release source
        run: cargo test --locked

      - name: Verify the package without uploading
        run: cargo publish --dry-run --locked

      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish to crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
