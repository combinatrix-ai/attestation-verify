name: Publish crate

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate the release without publishing authority
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      package_sha256: ${{ steps.package.outputs.sha256 }}
      rust_version: ${{ steps.toolchain.outputs.version }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, as of 2026-08-02
        with:
          toolchain: stable

      - name: Record the release toolchain
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          version="$(rustc --version | awk '{print $2}')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Validate tag and package version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF_TYPE}" = tag || {
            echo "expected a tag ref, not ${GITHUB_REF}" >&2
            exit 1
          }
          [[ "${RELEASE_TAG}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?)$ ]] || {
            echo "invalid release tag: ${RELEASE_TAG}" >&2
            exit 1
          }
          RELEASE_VERSION="${BASH_REMATCH[1]}"
          package_version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "attestation-verify") | .version')"
          test "${package_version}" = "${RELEASE_VERSION}" || {
            echo "Cargo package version ${package_version} does not match ${RELEASE_VERSION}" >&2
            exit 1
          }

      - name: Test the locked release source
        run: cargo test --locked

      - name: Verify the package without uploading
        run: cargo publish --dry-run --locked

      - name: Record the verified package digest
        id: package
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          package="target/package/attestation-verify-${RELEASE_TAG#v}.crate"
          test -f "$package"
          printf 'sha256=%s\n' "$(sha256sum "$package" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish the validated release without building it
    needs: validate
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    env:
      # Fresh Cargo state: no validation cache or repository credential helper.
      CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token
      RUSTUP_TOOLCHAIN: ${{ needs.validate.outputs.rust_version }}
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prepare the validated toolchain and reject repository Cargo hooks
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUSTUP_TOOLCHAIN" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          # --no-verify avoids Rust compilation, but Cargo config can also
          # select executable credential providers or compiler wrappers.
          for config in .cargo/config .cargo/config.toml; do
            if [[ -e "$config" || -L "$config" ]]; then
              echo "repository Cargo configuration is not allowed in the publishing job" >&2
              exit 1
            fi
          done
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
          printf 'CARGO_HOME=%s/release-cargo-home\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Match the package to the validated digest without building
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_SHA256: ${{ needs.validate.outputs.package_sha256 }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?)$ ]]
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          cargo package --no-verify --locked
          package="target/package/attestation-verify-${RELEASE_TAG#v}.crate"
          actual_sha256="$(sha256sum "$package" | awk '{print $1}')"
          test "$actual_sha256" = "$EXPECTED_SHA256" || {
            echo "release package differs from the validated package" >&2
            exit 1
          }

      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish without executing package build scripts
        run: cargo publish --no-verify --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
