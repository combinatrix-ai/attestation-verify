name: Differential verification

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 0'

permissions:
  contents: read
  attestations: read

env:
  CARGO_TERM_COLOR: always

jobs:
  differential:
    name: Verify parity with gh attestation verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, as of 2026-08-02
        with:
          toolchain: stable

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2, as of 2026-08-02

      - name: Run differential verification gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/differential.sh
